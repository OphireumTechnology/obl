    <script>
      // Intercept and prevent third-party browser extension errors (such as MetaMask extension iframe disconnects)
      (function() {
        var isExtensionError = function(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return s.indexOf('metamask') !== -1 ||
                 s.indexOf('failed to connect to metamask') !== -1 ||
                 s.indexOf('extension context invalidated') !== -1 ||
                 s.indexOf('chrome-extension://') !== -1 ||
                 s.indexOf('moz-extension://') !== -1;
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || reason)) || '';
          if (isExtensionError(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var src = event.filename || '';
          if (isExtensionError(msg) || isExtensionError(src)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
